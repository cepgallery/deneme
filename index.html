<!DOCTYPE html>
<html>
  <head>
    <title>CEP Gallery</title>
    <style>
      body {
        margin: 0;
        font-family: Helvetica, Arial;
        background: #0a0a0a;
        color: #fff;
      }
      .hero {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      h1 {
        font-size: 60px;
        margin: 0;
      }
      p {
        opacity: 0.6;
        margin-top: 10px;
      }
      .btn {
        margin-top: 30px;
        padding: 10px 20px;
        border: 1px solid #fff;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>CEP Gallery</h1>
      <p>Contemporary Exhibition Platform</p>
      <div class="btn">Enter</div>
    </div>

</html>
