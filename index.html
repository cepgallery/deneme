<!DOCTYPE html>
<html>
  <head>
    <title>CEP Gallery</title>
    <style>
      body {
        margin: 0;
        font-family: Helvetica, Arial;
        background: #0a0a0a;
        color: #fff;
      }

      header {
        padding: 20px;
        text-align: center;
        border-bottom: 1px solid #222;
      }

      h1 {
        margin: 0;
        font-size: 28px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 10px;
        padding: 20px;
      }

      .item {
        position: relative;
      }

      .item img {
        width: 100%;
        display: block;
      }

      .overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0,0,0,0.6);
        padding: 10px;
        font-size: 14px;
      }

      .overlay span {
        display: block;
        opacity: 0.7;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>CEP Gallery</h1>
    </header>

    <div class="grid">

      <div class="item">
        <img src="https://images.unsplash.com/photo-1549880338-65ddcdfd017b" />
        <div class="overlay">
          Abstract Form
          <span>Artist Name</span>
        </div>
      </div>

      <div class="item">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" />
        <div class="overlay">
          Minimal Space
          <span>Artist Name</span>
        </div>
      </div>

      <div class="item">
        <img src="https://images.unsplash.com/photo-1492724441997-5dc865305da7" />
        <div class="overlay">
          Geometry Study
          <span>Artist Name</span>
        </div>
      </div>

      <div class="item">
        <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e" />
        <div class="overlay">
          Landscape
          <span>Artist Name</span>
        </div>
      </div>

    </div>
  </body>
</html>
