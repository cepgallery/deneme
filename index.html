<!DOCTYPE html>
<html>
  <head>
    <title>CEP Gallery</title>
    <style>
      body {
        margin: 0;
        font-family: Arial;
        background: #0d0d0d;
        color: white;
      }
      .container {
        text-align: center;
        padding: 100px 20px;
      }
      h1 {
        font-size: 50px;
        letter-spacing: 2px;
      }
      p {
        font-size: 20px;
        opacity: 0.6;
      }
      .btn {
        margin-top: 30px;
        padding: 12px 24px;
        border: 1px solid white;
        display: inline-block;
        cursor: pointer;
      }
      .btn:hover {
        background: white;
        color: black;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>CEP Gallery</h1>
      <p>Contemporary Exhibition Platform</p>
      <div class="btn">Explore</div>
    </div>
  </body>
</html>
